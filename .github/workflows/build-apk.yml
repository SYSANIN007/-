name: Build APK

# Сборка debug-APK в облаке GitHub — локальная Java/Android SDK не нужны.
# Запускается автоматически при пуше в ветку приложения и вручную (Run workflow).
# Готовый APK публикуется в разделе Releases — можно скачать и установить на часы/эмулятор.
on:
  push:
    branches: [arena/01a10c66-repo, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write # чтобы выкладывать APK в GitHub Release

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # SDK на раннере уже есть; доустанавливаем нужные компоненты на всякий случай
      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wearschedule-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # APK подписан debug-ключом CI, поэтому отличается от локально собранного:
      # перед установкой нужно удалить старую версию приложения.
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          TAG="debug-$SHA"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "WearSchedule debug $SHA" \
            --notes "Автосборка ветки ${GITHUB_REF_NAME}. APK подписан debug-ключом CI — перед установкой удали старую версию." \
            --target "$GITHUB_SHA" --prerelease \
          || gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber
